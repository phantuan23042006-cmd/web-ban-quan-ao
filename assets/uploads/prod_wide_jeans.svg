<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="jeans" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)"/>
  <!-- Jeans shape -->
  <path d="M140,90 L260,90 L270,340 L210,340 L200,180 L190,180 L180,340 L130,340 Z" fill="url(#jeans)"/>
  <!-- Belt loops & pockets -->
  <rect x="140" y="90" width="120" height="20" fill="#075985"/>
  <rect x="190" y="92" width="20" height="16" rx="3" fill="#f59e0b"/>
  <path d="M150,120 Q170,140 185,120" fill="none" stroke="#e0f2fe" stroke-width="3"/>
  <path d="M250,120 Q230,140 215,120" fill="none" stroke="#e0f2fe" stroke-width="3"/>
  <!-- Stitches -->
  <line x1="200" y1="110" x2="200" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="200" y="375" text-anchor="middle" fill="#ecfdf5" font-family="sans-serif" font-size="16" font-weight="bold">Quần Jean Ống Rộng</text>
</svg>
